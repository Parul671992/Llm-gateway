spring:
  application:
    name: llmgateway
  data:
    redis:
      host: host.docker.internal
      port: 6379
      timeout: 2s
      connect-timeout: 2s
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/llmgateway
    username: gateway
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

groq:
  api-key: ${GROQ_API_KEY}
  base-url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-20b
  connect-timeout: 2s
  read-timeout: 30s

gateway:
  cache:
    answer-ttl: 1h
    key-version: v1
  stampede:
    lock-ttl: 10s
    wait-timeout: 15s
    poll-interval: 50ms
  admin:
    token: ${ADMIN_TOKEN}
  auth:
    key-cache-ttl: 5m
  rate-limit:
    requests-per-minute: 20

management:
  endpoints:
    web:
      exposure:
        include: health,metrics