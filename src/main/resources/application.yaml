spring:
  application:
    name: llmgateway
  data:
    redis:
      host: host.docker.internal
      port: 6379
      timeout: 2s
      connect-timeout: 2s
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/llmgateway
    username: gateway
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

gateway:
  cache:
    answer-ttl: 1h
    key-version: v1
  stampede:
    lock-ttl: 10s
    wait-timeout: 15s
    poll-interval: 50ms
  admin:
    token: ${ADMIN_TOKEN}
  auth:
    key-cache-ttl: 5m
  rate-limit:
    requests-per-minute: 20

llm:
  primary:
    name: groq
    base-url: https://api.groq.com/openai/v1
    api-key: ${GROQ_API_KEY}
    model: openai/gpt-oss-20b
    connect-timeout: 2s
    read-timeout: 30s
    max-tokens: 1024
    input-micros-per-million: 75000
    output-micros-per-million: 300000
  fallback:
    name: gemini
    base-url: https://generativelanguage.googleapis.com/v1beta/openai
    api-key: ${GEMINI_API_KEY}
    model: gemini-3.5-flash-lite
    connect-timeout: 2s
    read-timeout: 30s
    max-tokens: 1024
    input-micros-per-million: 100000
    output-micros-per-million: 400000
  circuit-breaker:
    failure-rate-threshold: 50
    sliding-window-size: 10
    minimum-number-of-calls: 5
    wait-in-open-state: 30s
    calls-in-half-open-state: 3